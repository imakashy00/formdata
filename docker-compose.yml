# Define all services that make up the application
services:
  # PostgreSQL Database Service
  db:
    # Use official PostgreSQL image version 15
    image: postgres:15
    # Automatically restart the container unless stopped manually
    restart: unless-stopped
    # Environment variables for PostgreSQL configuration (loaded from .env file)
    environment:
      # Database username
      POSTGRES_USER: ${POSTGRES_USER}
      # Database password
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Initial database name to create
      POSTGRES_DB: ${POSTGRES_DB}
    # Mount volumes for persistent data storage
    volumes:
      # Store database files in named volume 'db-data' so data persists between restarts
      - db-data:/var/lib/postgresql/data
    # Health check to verify database is ready before starting dependent services
    healthcheck:
      # Command to test if PostgreSQL is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # Check every 5 seconds
      interval: 5s
      # Wait max 5 seconds for response
      timeout: 5s
      # Retry 5 times before marking as unhealthy
      retries: 5

  # Redis Cache Service
  redis:
    # Use official Redis image version 7
    image: redis:7
    # Automatically restart the container unless stopped manually
    restart: unless-stopped
    # Map ports - expose port 6379 from container to host machine
    ports:
      # Format: "host_port:container_port"
      - "6379:6379"

  # FastAPI Web Application Service
  web:
    # Build Docker image from Dockerfile in current directory (.)
    build: .
    # Define service dependencies and their conditions
    depends_on:
      # Wait for 'db' service to be healthy before starting
      db:
        condition: service_healthy
      # Wait for 'redis' service to start before starting
      redis:
        condition: service_started
    ports:
      # Map host port 8000 to the container port Uvicorn listens on
      - "8000:8000"
    env_file:
      - .env
    # Mount volumes for code and dependencies
    volumes:
      # Mount current directory to /app with caching enabled
      - .:/app:cached
      # Exclude virtual environment from mount to avoid conflicts
      - /app/.venv
    # Run the root startup script when the container starts
    command: ["/app/start.sh"]

# Define named volumes (persistent storage)
volumes:
  # Named volume for PostgreSQL data - persists across container restarts
  db-data:
