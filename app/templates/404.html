<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found — Formdata</title>

    <meta name="description" content="The page you're looking for could not be found.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/output.css') }}">


</head>

<body class="min-h-screen bg-white font-sans text-gray-900 antialiased">

    <!-- Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute left-1/2 top-[-180px] h-[500px] w-[700px]
                   -translate-x-1/2 rounded-full
                   bg-brand-light blur-3xl opacity-80">
        </div>

        <div class="absolute bottom-[-200px] left-[-150px]
                   h-[400px] w-[400px] rounded-full
                   bg-brand-mid blur-3xl opacity-40">
        </div>
    </div>

    <!-- Header -->
    <header class="absolute left-0 right-0 top-0">
        <div class="mx-auto flex max-w-7xl items-center px-6 py-6 lg:px-8">

            <a href="/" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-md flex items-center justify-center ">
                    <svg xmlns="http://www.w3.org/2000/svg" version="1.0" width="200.000000pt" height="200.000000pt"
                        viewBox="0 0 200.000000 200.000000" preserveAspectRatio="xMidYMid meet"
                        transform="matrix(1, 0, 0, 1, 0, 0)">

                        <g transform="translate(0.000000,200.000000) scale(0.100000,-0.100000)" fill="#2563eb"
                            stroke="none">
                            <path
                                d="M514 1616 c-94 -30 -177 -116 -203 -211 -7 -26 -11 -196 -11 -482 l0 -443 115 0 115 0 0 239 0 239 173 4 c224 4 229 7 288 165 16 43 29 79 29 81 0 1 -110 2 -245 2 l-245 0 0 66 c0 59 3 68 29 95 l29 29 220 0 219 0 10 33 c6 17 25 69 42 115 l30 82 -277 -1 c-196 0 -289 -4 -318 -13z"
                                fill="#2563eb" />
                            <path
                                d="M1124 1517 l-42 -112 127 -6 c144 -6 177 -17 244 -78 166 -154 129 -479 -67 -584 -39 -21 -57 -22 -336 -27 l-295 -5 -3 -112 -3 -113 300 0 c271 0 305 2 364 20 127 39 233 130 301 259 47 91 66 174 66 301 0 216 -82 389 -230 488 -87 59 -170 82 -289 82 l-96 0 -41 -113z"
                                fill="#2563eb" />
                        </g>
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-900">Formdata</span>
            </a>

        </div>
    </header>

    <!-- Main -->
    <main class="flex min-h-screen items-center justify-center px-6 py-24">

        <div class="w-full max-w-2xl text-center">

            <!-- 404 -->
            <div class="relative mx-auto mb-8 w-fit">

                <div class="absolute inset-0 scale-110 rounded-full
                           bg-brand-mid/50 blur-3xl">
                </div>

                <div class="relative">
                    <span class="font-mono text-[7rem] font-medium
                               leading-none tracking-[-0.08em]
                               text-brand sm:text-[9rem]">
                        404
                    </span>
                </div>

            </div>

            <!-- Content -->
            <div class="space-y-5">

                <div>
                    <h1 class="text-3xl font-bold tracking-tight
                               text-gray-900 sm:text-4xl">
                        Looks like you're lost.
                    </h1>

                    <p class="mx-auto mt-4 max-w-lg text-base
                               leading-7 text-gray-500 sm:text-lg">
                        The page you're looking for doesn't exist or
                        may have been moved to another location.
                    </p>
                </div>

                <!-- Buttons -->
                <div class="flex flex-col items-center justify-center
                            gap-3 pt-4 sm:flex-row">

                    <a href="/" class="inline-flex h-11 items-center justify-center
                               gap-2 rounded-lg bg-brand px-5
                               text-sm font-semibold text-white
                               shadow-sm shadow-blue-200
                               transition-all
                               hover:bg-brand-dark
                               hover:shadow-md
                               focus:outline-none
                               focus:ring-2
                               focus:ring-brand
                               focus:ring-offset-2">

                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10h14V10" />
                        </svg>

                        Back to home
                    </a>

                    <button type="button" onclick="history.back()" class="inline-flex h-11 items-center justify-center
                               gap-2 rounded-lg border border-gray-200
                               bg-white px-5 text-sm font-semibold
                               text-gray-700
                               transition
                               hover:border-gray-300
                               hover:bg-gray-50
                               focus:outline-none
                               focus:ring-2
                               focus:ring-brand
                               focus:ring-offset-2">

                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6" />
                        </svg>

                        Go back
                    </button>

                </div>
            </div>

            <!-- Small status -->
            <div class="mt-14 inline-flex items-center gap-2
                       rounded-full border border-gray-200
                       bg-white/80 px-3 py-1.5
                       text-xs font-medium text-gray-500
                       shadow-sm backdrop-blur">

                <span class="h-1.5 w-1.5 rounded-full bg-brand">
                </span>

                <span class="font-mono">
                    ERROR_404
                </span>

            </div>

        </div>

    </main>

    <!-- Footer -->
    {% include 'partials/footer.html' %}

</body>

</html>
