<!-- Tab View: TEMPLATES -->
<div x-show="activeTab === 'templates'" class="p-5 md:p-7" x-cloak>
    <div class="max-w-2xl bg-white rounded-xl border border-gray-100 shadow-sm p-6">
        <h3 class="text-sm font-semibold text-gray-900 mb-1">Email Templates</h3>
        <p class="text-xs text-gray-400 mb-5">Customize the email notifications sent out on new form responses.</p>

        <form hx-post="projects/{{form.project_id}}/formss/{{form.id}}/template" hx-swap="none">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-700 mb-2">Subject Line</label>
                <input type="text" name="subject"
                    class="w-full px-3.5 py-2 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand-light transition-all placeholder:text-gray-400 text-gray-900"
                    value="New Submission Alert: [Form Name]">
            </div>
            <div class="mb-5">
                <label class="block text-xs font-semibold text-gray-700 mb-2">Email Body (Markdown or HTML)</label>
                <textarea rows="6" name="body"
                    class="w-full px-3.5 py-2 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand-light transition-all placeholder:text-gray-400 text-gray-900">You received a new message submission through your form!&#10;&#10;[Submission Details]</textarea>
            </div>
            <button type="submit"
                class="px-4 py-2 text-xs font-medium text-white bg-brand hover:bg-brand-dark rounded-lg shadow-sm transition-colors">
                Save Template
            </button>
        </form>
    </div>
</div>
