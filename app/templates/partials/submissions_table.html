<div
    class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden hover:shadow-md hover:border-brand-mid transition-all">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr
                    class="bg-gray-50 border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    <th class="p-4 pl-6">Submitter</th>
                    <th class="p-4">Date</th>
                    <th class="p-4">Country</th>
                    <th class="p-4">Status</th>
                    <th class="p-4">Sync</th>
                    <th class="p-4">Note</th>
                    <th class="p-4 text-center w-28">Mark As</th>
                    <th class="p-4 pr-6 text-right w-24">Management</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-50 text-sm text-gray-600">
                {% if submissions %}
                {% for sub in submissions %}
                {% include "partials/submission_row.html" %}
                {% endfor %}
                {% else %}
                <tr>
                    <td colspan="8" class="p-8 text-center text-gray-400">
                        No submissions found.
                    </td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</div>
