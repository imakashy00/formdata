<section class="bg-white rounded-xl border border-gray-200/60 shadow-sm p-5 flex flex-col justify-between">
    <div>
        <h3 class="text-sm font-bold text-gray-900 mb-1">Quota &amp; Usage Limits</h3>
        <p class="text-xs text-gray-400 mb-4">Resets automatically at the start of the next billing period.</p>
        <div class="space-y-2 mt-2">
            <div class="flex justify-between text-xs font-semibold gap-3">
                <span class="text-gray-500">Monthly Tier Allowance</span>
                <span class="text-gray-900 whitespace-nowrap">{{ submission_quota.usage }} / {{ submission_quota.limit }} units</span>
            </div>
            <svg viewBox="0 0 100 10" class="w-full h-3" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ submission_quota.percentage }}">
                <rect width="100" height="10" rx="5" fill="#f3f4f6" />
                <rect width="{{ submission_quota.percentage }}" height="10" rx="5" fill="#4f46e5" />
            </svg>
        </div>
    </div>
    <div class="pt-4 border-t border-gray-100 mt-4 flex items-center justify-between text-xs">
        <span class="text-gray-500 font-medium">Usage Level Status: <b class="text-gray-900">{{ submission_quota.percentage }}%</b></span>
        <a href="/billing" class="text-indigo-600 font-semibold hover:underline">Manage Plan</a>
    </div>
</section>
