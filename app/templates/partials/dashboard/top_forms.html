<section class="bg-white rounded-xl border border-gray-200/60 shadow-sm p-5">
    <h3 class="text-sm font-bold text-gray-900 mb-3">Top forms by submission count</h3>
    <div class="divide-y divide-gray-100">
        {% for form in top_forms %}
        <div class="py-3 flex items-center justify-between gap-4">
            <span class="text-xs font-semibold text-gray-900 truncate">{{ form.name }}</span>
            <span class="bg-gray-100 text-gray-800 text-xs px-2.5 py-0.5 rounded-full font-bold whitespace-nowrap">{{ form.count }} entries</span>
        </div>
        {% else %}
        <p class="text-xs text-gray-400 py-4 text-center">No submissions yet.</p>
        {% endfor %}
    </div>
</section>
