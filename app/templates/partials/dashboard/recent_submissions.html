<section class="bg-white rounded-xl border border-gray-200/60 shadow-sm p-5">
    <h3 class="text-sm font-bold text-gray-900 mb-3">Recent accepted submissions</h3>
    <div class="divide-y divide-gray-100">
        {% for submission in recent_submissions %}
        <div class="py-3 flex items-center justify-between gap-4">
            <span class="text-xs font-semibold text-gray-900 truncate">{{ submission.form_name }}</span>
            <time class="text-[10px] text-gray-400 whitespace-nowrap">{{ submission.created_at }}</time>
        </div>
        {% else %}
        <p class="text-xs text-gray-400 py-4 text-center">No accepted submissions yet.</p>
        {% endfor %}
    </div>
</section>
