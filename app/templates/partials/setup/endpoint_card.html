<div
    class="rounded-2xl border-2 border-brand/20 bg-linear-to-br from-blue-50/70 via-white to-slate-50 p-5 sm:p-6 shadow-sm">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div class="space-y-1">
            <div class="flex items-center gap-2">
                <span
                    class="rounded-md bg-brand-dark px-2 py-0.5 text-[11px] font-bold uppercase tracking-wider text-white">Your
                    Endpoint</span>
                <span class="text-xs text-slate-500">Method: <strong class="text-slate-800">POST</strong></span>
            </div>
            <h2 class="text-lg font-bold text-slate-900">Form Submission URL</h2>
            <p class="text-xs sm:text-sm text-slate-600 max-w-xl">
                Paste this destination URL into your website builder (Webflow, Framer, Squarespace, Wix, Carrd) or
                your custom HTML form's <code
                    class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-xs text-slate-800">action</code>
                attribute.
            </p>
        </div>
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
            <div class="flex items-center rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 shadow-inner">
                <svg class="mr-2 h-4 w-4 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
                <span
                    class="font-mono text-xs sm:text-sm font-semibold text-slate-900 select-all break-all">https://formdata.cloud/f/{{
                    form.public_id }}</span>
            </div>
            <button type="button" @click="copyEndpoint()"
                class="inline-flex items-center justify-center gap-2 rounded-xl bg-brand-dark px-4 py-2.5 text-xs sm:text-sm font-semibold text-white shadow transition hover:bg-brand hover:shadow-md active:scale-95 cursor-pointer">
                <svg x-show="!endpointCopied" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <svg x-show="endpointCopied" x-cloak class="h-4 w-4 text-emerald-300" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                <span x-text="endpointCopied ? 'Copied URL!' : 'Copy URL'"></span>
            </button>
        </div>
    </div>
</div>
