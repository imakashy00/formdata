<form hx-put="/projects/{{project.id}}/settings" hx-target="this" hx-disabled-elt="find button[type=submit]"
    hx-swap="outerHTML" class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-6">

    <!-- Project Name Field -->
    <div>
        <label class="block text-xs font-semibold text-gray-700 mb-2">Project Name</label>
        <input type="text" name="project_name"
            class="w-full px-3.5 py-2 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand-light transition-all text-gray-900"
            value="{{project.name}}">
    </div>

    <!-- Project Members Section -->
    <div class="pt-4 border-t border-gray-50">
        <h4 class="text-xs font-semibold text-gray-700 mb-3">Project Members</h4>
        <div class="space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div
                        class="w-7 h-7 rounded-full bg-brand-light flex items-center justify-center text-[11px] font-bold text-brand">
                        U</div>
                    <span class="text-xs text-gray-900 font-medium">You (Owner)</span>
                </div>
                <span class="text-[10px] text-gray-400 bg-gray-50 px-2 py-0.5 rounded-md">Admin</span>
            </div>
        </div>
    </div>

    <!-- Submit Actions -->
    <div class="pt-2 flex flex-1 gap-1">
        <button type="submit"
            class="px-4 py-2 text-xs font-medium text-white bg-brand hover:bg-brand-dark rounded-lg shadow-sm transition-colors">
            Save Settings
        </button>
        {% with id="modal-loader", text=false, overlay=false %}
        {% include 'partials/loading.html' %}
        {% endwith %}
    </div>
</form>
