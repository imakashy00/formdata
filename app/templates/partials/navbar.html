                    Sign in
                </button>
            </form>

            <div class="md:hidden relative">
                <button id="mobile-menu-button" type="button" class="p-2 rounded-md bg-gray-100" aria-expanded="false"
                    aria-controls="mobile-menu">
                    <svg class="h-5 w-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <div id="mobile-menu"
                    class="hidden absolute right-0 mt-2 w-44 bg-white shadow-lg rounded-lg py-2 border border-gray-100">
                    <a href="#how-it-works" class="w-full text-left text-sm px-4 py-2 hover:bg-gray-50">How it
                        works</a>
                    <a href="#features" class="w-full text-left text-sm px-4 py-2 hover:bg-gray-50">Features</a>
                    <a href="#pricing" class="w-full text-left text-sm px-4 py-2 hover:bg-gray-50">Pricing</a>
                    <div class="border-t border-gray-100 mt-1 pt-1">
                        <form action="/auth" method="post"><button
                                class="w-full text-left text-sm px-4 py-2 hover:bg-gray-50">Sign in</button></form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const button = document.getElementById('mobile-menu-button');
            const menu = document.getElementById('mobile-menu');

            if (!button || !menu) return;

            const closeMenu = () => {
                menu.classList.add('hidden');
                button.setAttribute('aria-expanded', 'false');
            };

            const openMenu = () => {
                menu.classList.remove('hidden');
                button.setAttribute('aria-expanded', 'true');
            };

            button.addEventListener('click', (event) => {
                event.stopPropagation();
                if (menu.classList.contains('hidden')) {
                    openMenu();
                } else {
                    closeMenu();
                }
            });

            document.addEventListener('click', (event) => {
                if (!menu.contains(event.target) && !button.contains(event.target)) {
                    closeMenu();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeMenu();
                }
            });
        })();
    </script>
</header>
