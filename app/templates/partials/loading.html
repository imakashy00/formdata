<div id="{{ id }}"
    class="htmx-indicator {% if overlay %}absolute inset-0 z-10 items-center justify-center gap-2 bg-white/70 backdrop-blur-[1px]{% else %}inline-flex items-center gap-2{% endif %}"
    role="status" aria-hidden="true">
    <span class="h-8 w-8 ">
        <svg fill="hsl(240, 97%, 42%)" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="RadialGradient8932">
                    <stop offset="0%" stop-color="#2563eb" stop-opacity="1" />
                    <stop offset="100%" stop-color="white" stop-opacity="0.25" />
                </linearGradient>
            </defs>
            <style>
                @keyframes spin8932 {
                    to {
                        transform: rotate(360deg);
                    }
                }

                #circle8932 {
                    transform-origin: 50% 50%;
                    stroke: url(#RadialGradient8932);
                    fill: none;
                    animation: spin8932 .5s infinite linear;
                }
            </style>
            <circle cx="10" cy="10" r="8" id="circle8932" stroke-width="2" />
        </svg>
    </span>
    {% if text %}<span class="text-xs text-gray-500">{{ text }}</span>{% endif %}
</div>
