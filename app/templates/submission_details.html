{% extends 'base.html' %}

{% block title %}Forms — Formdata{% endblock %}

{% block content %}
<div class="page animate-slide-up" id="page-project" x-data="{ activeTab: '{{ active_tab }}' }">
    <div class="border-b border-gray-100 bg-white px-5 md:px-5 mb-4 ">
        <div class="flex gap-2 md:gap-4 p-2 align-center">
            <svg class="w-6 h-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <p class="text-xl text-gray-900">{{ form.name }}</p>
        </div>
        <nav class="flex gap-6 -mb-px" aria-label="Project tabs">
            {% for tab_id in ['submissions', 'setup', 'templates', 'settings', 'integrations']
            %}
            <button type="button" hx-get="/projects/{{form.project_id}}/forms/{{ form.id }}/{{ tab_id }}"
                hx-target="#tab-content" hx-push-url="true" hx-history="false" @click="activeTab = '{{ tab_id }}'"
                x-cloak
                :class="activeTab === '{{ tab_id }}' ? 'border-brand text-brand' : 'border-transparent text-gray-500 hover:text-gray-700'"
                class="py-4 px-1 border-b-2 text-sm transition-all">
                {{ tab_labels[tab_id] }}

            </button>
            {% endfor %}
        </nav>
    </div>

    <div id="tab-content" class="space-y-4">
        {% include "partials/submission_details_card.html" %}
    </div>
</div>
{% endblock %}
