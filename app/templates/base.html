<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dynamic Title fallback if child template doesn't specify one -->
    <title>{% block title %}Formdata{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/output.css') }}">

    <script defer src="{{ url_for('static', path='/js/htmx.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/alpine.js' )}}"></script>


    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
    <!-- Placeholder if specific pages need custom head scripts/styles -->
    {% block head %}{% endblock %}
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex min-h-screen">
        <!-- Automatically includes your sidebar and topbar across all templates inheriting base.html -->
        {% include 'sidebar.html' %}

        <!-- Right Column Section (Topbar + Main Interactive Body Content) -->
        <div class="flex-1 flex flex-col md:pl-56">

            <!-- Dynamic Content Window Slot Component -->
            <main class="flex-1 p-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <!-- Toast Component -->
    <div id="toast" x-data="toastComponent()"
        @show-toast.window="show($event.detail.value, $event.detail.type || 'success')" x-cloak :class="[
            openToast ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2 pointer-events-none',
            type === 'error' ? 'bg-red-600' : 'bg-brand'
         ]"
        class="fixed bottom-6 right-6 z-50 text-white text-sm font-medium px-5 py-3 rounded-xl shadow-xl transition-all duration-200">
        <span x-text="message"></span>
    </div>
    <!-- Logout Confirmation -->
    <dialog id="logoutDialog"
        class="fixed inset-0 m-auto w-[calc(100%-2rem)] max-w-sm rounded-2xl p-0 border-0 shadow-2xl backdrop:bg-black/40">

        <div class="p-6">

            <div class="flex items-start gap-4">

                <div class="w-10 h-10 shrink-0 rounded-full
                           bg-red-50 text-red-600
                           flex items-center justify-center">

                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7" />
                    </svg>

                </div>

                <div>
                    <h2 class="text-base font-semibold text-gray-900">
                        Sign out?
                    </h2>

                    <p class="mt-1 text-sm text-gray-500">
                        Are you sure you want to sign out of your account?
                    </p>
                </div>

            </div>


            <div class="mt-6 flex gap-3">

                <button type="button" onclick="closeLogoutDialog()" class="flex-1 px-4 py-2.5 rounded-lg
                           text-sm font-medium text-gray-700
                           bg-gray-100 hover:bg-gray-200
                           transition-colors">

                    Cancel
                </button>

                <form action="/logout" method="POST" class="flex-1">
                    <button type="submit" class="w-full px-4 py-2.5 rounded-lg
                               text-sm font-medium text-white
                               bg-red-600 hover:bg-red-700
                               transition-colors">

                        Sign out
                    </button>
                </form>

            </div>

        </div>
    </dialog>
    <script>
        const logoutDialog = document.getElementById("logoutDialog");

        function openLogoutDialog() {
            logoutDialog.showModal();
        }

        function closeLogoutDialog() {
            logoutDialog.close();
        }

        logoutDialog.addEventListener("click", (event) => {
            if (event.target === logoutDialog) {
                logoutDialog.close();
            }
        });
    </script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('toastComponent', () => ({
                openToast: false,
                message: '',
                type: 'success', // Can be 'success' or 'error'
                timeoutId: null,

                show(text, type = 'success') {
                    if (this.timeoutId) {
                        clearTimeout(this.timeoutId);
                    }

                    this.message = text;
                    this.type = type;
                    this.openToast = true;

                    this.timeoutId = setTimeout(() => {
                        this.openToast = false;
                        this.timeoutId = null;
                    }, 3500);
                }
            }));
        });
    </script>

    <!-- Placeholder if specific pages need script elements right before </body> closure -->
    {% block script %}{% endblock %}
</body>

</html>
