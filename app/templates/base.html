<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dynamic Title fallback if child template doesn't specify one -->
    <title>{% block title %}Formdata{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/output.css') }}">

    {% include 'partials/head_shim.html' %}
    <script defer src="{{ url_for('static', path='/js/htmx.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/alpine.js' )}}"></script>

    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
    <!-- Placeholder if specific pages need custom head scripts/styles -->
    {% block head %}{% endblock %}
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex min-h-screen">
        <!-- sidebar templates -->
        {% include 'sidebar.html' %}

        <!-- Right Column Section (Topbar + Main Interactive Body Content) -->
        <div class="flex-1 flex flex-col md:pl-56">

            <!-- Dynamic Content Window Slot Component -->
            <main class="flex-1 p-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <!-- Toast Component -->
    <div id="toast" x-data="toastComponent()"
        @show-toast.window="show($event.detail.value, $event.detail.type || 'success')" x-cloak :class="[ 
        openToast ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2 pointer-events-none', 
        type === 'success' ? 'bg-emerald-500' : '',
        type === 'warning' ? 'bg-amber-500': '',
        type === 'error' ? 'bg-red-500' : '',
        type === 'info' ? 'bg-blue-500' : ''
     ]"
        class="fixed bottom-6 right-6 z-50 text-white text-sm font-medium px-5 py-3 rounded-xl shadow-xl transition-all duration-200">
        <span x-text="message"></span>
    </div>

    <dialog id="confirmationDialog"
        class="fixed inset-0 m-auto w-[calc(100%-2rem)] max-w-sm rounded-2xl border-0 p-0 shadow-2xl backdrop:bg-black/40">
        <div class="p-6">
            <div class="flex items-start gap-4">
                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-red-50 text-red-600">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86l-8.18 14.18A1 1 0 0 0 3 19.5h18a1 1 0 0 0 .89-1.46L13.71 3.86a1 1 0 0 0-1.72 0z" />
                    </svg>
                </div>
                <div>
                    <h2 id="confirmationDialogTitle" class="text-base font-semibold text-gray-900"></h2>
                    <p id="confirmationDialogDescription" class="mt-1 text-sm text-gray-500"></p>
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button type="button" id="confirmationDialogCancel" class="flex-1 rounded-lg bg-gray-100 px-4 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-200">
                    Cancel
                </button>
                <button type="button" id="confirmationDialogConfirm" class="flex-1 rounded-lg bg-red-600 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-red-700">
                    Confirm
                </button>
            </div>
        </div>
    </dialog>


    <script>
        (() => {
            const dialog = document.getElementById("confirmationDialog");
            const title = document.getElementById("confirmationDialogTitle");
            const description = document.getElementById("confirmationDialogDescription");
            const confirmButton = document.getElementById("confirmationDialogConfirm");
            let pendingAction = null;

            const toneClasses = {
                danger: "bg-red-600 hover:bg-red-700",
                caution: "bg-amber-600 hover:bg-amber-700",
                neutral: "bg-gray-900 hover:bg-gray-800",
            };

            window.closeConfirmationDialog = () => {
                dialog.close();
                pendingAction = null;
            };

            window.openConfirmationDialog = ({ title: heading, description: message, confirmLabel = "Confirm", confirmTone = "danger", onConfirm }) => {
                title.textContent = heading;
                description.textContent = message;
                confirmButton.textContent = confirmLabel;
                confirmButton.className = `flex-1 rounded-lg px-4 py-2.5 text-sm font-medium text-white transition-colors ${toneClasses[confirmTone] || toneClasses.danger}`;
                pendingAction = onConfirm;
                dialog.showModal();
            };

            document.getElementById("confirmationDialogCancel").addEventListener("click", window.closeConfirmationDialog);
            confirmButton.addEventListener("click", () => {
                const action = pendingAction;
                window.closeConfirmationDialog();
                if (action) action();
            });
            dialog.addEventListener("click", (event) => {
                if (event.target === dialog) window.closeConfirmationDialog();
            });
            dialog.addEventListener("cancel", () => { pendingAction = null; });

            document.body.addEventListener("htmx:confirm", (event) => {
                const { elt, issueRequest, question } = event.detail;
                if (!question) return;

                event.preventDefault();
                window.openConfirmationDialog({
                    title: elt.dataset.confirmTitle || "Please confirm",
                    description: elt.dataset.confirmDescription || question,
                    confirmLabel: elt.dataset.confirmLabel || "Confirm",
                    confirmTone: elt.dataset.confirmTone || "danger",
                    onConfirm: () => issueRequest(true),
                });
            });
        })();
    </script>
    <script>
        function registerToastComponent() {
            if (window.Alpine) {
                Alpine.data('toastComponent', () => ({
                    openToast: false,
                    message: '',
                    type: 'success', // Can be 'success' or 'error'
                    timeoutId: null,

                    show(text, type = 'success') {
                        if (this.timeoutId) {
                            clearTimeout(this.timeoutId);
                        }

                        this.message = text;
                        this.type = type;
                        this.openToast = true;

                        this.timeoutId = setTimeout(() => {
                            this.openToast = false;
                            this.timeoutId = null;
                        }, 3500);
                    }
                }));
            }
        }

        if (window.Alpine) {
            registerToastComponent();
        } else {
            document.addEventListener('alpine:init', registerToastComponent, { once: true });
        }

        window.showToast = function (message, type = 'success') {
            window.dispatchEvent(new CustomEvent('show-toast', { detail: { value: message, type } }));
        };
    </script>
    <script>
        document.body.addEventListener('htmx:responseError', function (event) {
            const xhr = event.detail.xhr;

            // Server already sent its own HX-Trigger toast — don't stack a second one on top.
            if ((xhr.getResponseHeader('HX-Trigger') || '').includes('show-toast')) return;

            let message = `An error occurred (Status ${xhr.status})`;
            if (xhr.responseText) {
                try {
                    const parsed = JSON.parse(xhr.responseText);
                    message = parsed.detail || parsed.message || message;
                } catch {
                    if (!xhr.responseText.trim().startsWith('<')) message = xhr.responseText;
                }
            }
            window.showToast(message, 'error');
        });

        // responseError only fires when the server responds at all. A dropped
        // connection / timeout fires sendError instead, with no status to read.
        document.body.addEventListener('htmx:sendError', function () {
            window.showToast("Couldn't reach the server. Check your connection.", 'error');
        });
    </script>
    <!--
      Place this ONCE in your base/layout template — anywhere outside #tab-content
      (e.g. right next to the nav, or before </body>). It must NOT live inside any
      file that htmx swaps in, or the race condition comes right back.
    
      Load order needed: this script before Alpine core, OR Alpine core with `defer`
      and this listening on `alpine:init` (already handled below).
    -->
    <script>
        // --- Dependency-free syntax highlighter (used by the codeBlock component) ---
        function highlightCode(code) {
            const escapeHtml = (s) => s
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            const tokenRegex = new RegExp([
                /<!--[\s\S]*?-->/,                                      // 1 html comment
                /{\/\*[\s\S]*?\*\/}/,                                   // 2 jsx comment
                /\/\*[\s\S]*?\*\//,                                     // 3 block comment
                /\/\/[^\n]*/,                                           // 4 line comment
                /"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`/, // 5 string
                /@[A-Za-z_]\w*/,                                        // 6 decorator
                /<\/?[A-Z][\w.-]*/,                                     // 7 JSX/Vue/Svelte component
                /<\/?[a-z][\w.-]*/,                                     // 8 HTML tag
                /(?:v-[\w-]+|:[\w-]+|@[\w-]+|bind:[\w-]+|on:[\w-]+|\[\(?[\w-]+\)?\])(?=\s*=|\s|>)/, // 9 framework binding
                /\b[a-zA-Z_][\w:.-]*(?=[\]\)]?\s*=(?!=))/,             // 10 attribute / prop name
                /\b(?:import|export|from|default|function|return|const|let|var|class|extends|implements|interface|type|new|this|async|await|if|else|for|of|in|while|npm|install|public|private|readonly|standalone|selector|templateUrl|imports|string|number|boolean|void|null|undefined|any)\b/, // 11 keyword
                /\b\d+(?:\.\d+)?\b/                                     // 12 number
            ].map((r) => `(${r.source})`).join('|'), 'g');

            let out = '';
            let last = 0;
            let match;

            while ((match = tokenRegex.exec(code)) !== null) {
                const full = match[0];
                out += escapeHtml(code.slice(last, match.index));

                let cls = null;
                if (match[1] || match[2] || match[3] || match[4]) cls = 'tok-comment';
                else if (match[5]) cls = 'tok-string';
                else if (match[6]) cls = 'tok-keyword';
                else if (match[7]) cls = 'tok-component';
                else if (match[8]) cls = 'tok-tag';
                else if (match[9]) cls = 'tok-directive';
                else if (match[10]) cls = 'tok-attr';
                else if (match[11]) cls = 'tok-keyword';
                else if (match[12]) cls = 'tok-number';

                out += cls ? `<span class="${cls}">${escapeHtml(full)}</span>` : escapeHtml(full);
                last = match.index + full.length;
            }
            out += escapeHtml(code.slice(last));
            return out;
        }

        // Registered exactly once, before Alpine.start() ever runs, so every
        // future htmx swap that inserts x-data="integrationSetup" / "codeBlock"
        // finds the component already defined — no race.
        document.addEventListener('alpine:init', () => {
            Alpine.data('codeBlock', () => ({
                code: '',
                highlighted: '',
                copied: false,

                init() {
                    let raw = '';
                    const snippetEl = this.$el.querySelector('.raw-code-snippet');
                    if (snippetEl) {
                        raw = snippetEl.textContent || '';
                    }
                    raw = raw.trim();
                    if ((raw.startsWith('"') && raw.endsWith('"')) || (raw.startsWith("'") && raw.endsWith("'"))) {
                        raw = raw.slice(1, -1).trim();
                    }
                    raw = raw.replace(/\\"/g, '"').replace(/\\'/g, "'");

                    this.code = raw;
                    this.highlighted = highlightCode(this.code);
                },

                async copy() {
                    const textToCopy = this.code;
                    try {
                        if (navigator.clipboard && window.isSecureContext) {
                            await navigator.clipboard.writeText(textToCopy);
                        } else {
                            throw new Error('Clipboard fallback');
                        }
                    } catch (e) {
                        const textarea = document.createElement('textarea');
                        textarea.value = textToCopy;
                        textarea.setAttribute('readonly', '');
                        textarea.style.position = 'fixed';
                        textarea.style.left = '-9999px';
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        textarea.remove();
                    }
                    this.copied = true;
                    setTimeout(() => { this.copied = false; }, 2000);
                }
            }));

            // Takes the form's public_id as a param instead of baking a URL in at
            // registration time, so it stays correct even when htmx (with
            // hx-push-url) navigates to a *different* form without a full reload.
            Alpine.data('integrationSetup', (publicId) => ({
                framework: 'html',
                mode: 'basic',
                endpointUrl: `https://formdata.cloud/f/${publicId}`,
                endpointCopied: false,

                async copyEndpoint() {
                    const text = this.endpointUrl;
                    try {
                        if (navigator.clipboard && window.isSecureContext) {
                            await navigator.clipboard.writeText(text);
                        } else {
                            throw new Error('Clipboard fallback');
                        }
                    } catch (err) {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.setAttribute('readonly', '');
                        ta.style.position = 'fixed';
                        ta.style.left = '-9999px';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        ta.remove();
                    }
                    this.endpointCopied = true;
                    setTimeout(() => { this.endpointCopied = false; }, 2000);
                }
            }));
        });
    </script>
    <!-- Placeholder if specific pages need script elements right before </body> closure -->
    {% block script %}{% endblock %}
</body>

</html>
