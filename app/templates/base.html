<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dynamic Title fallback if child template doesn't specify one -->
    <title>{% block title %}Formdata{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#dc2626', dark: '#b91c1c', light: '#fef2f2', mid: '#fee2e2' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous">
        </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
    <link href="https://googleapis.com" rel="stylesheet" />
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
    <!-- Placeholder if specific pages need custom head scripts/styles -->
    {% block head %}{% endblock %}
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex min-h-screen">
        <!-- Automatically includes your sidebar and topbar across all templates inheriting base.html -->
        {% include 'sidebar.html' %}

        <!-- Right Column Section (Topbar + Main Interactive Body Content) -->
        <div class="flex-1 flex flex-col md:pl-56">

            <!-- Top Navigation Banner Content Area -->
            {% include 'topbar.html' %}

            <!-- Dynamic Content Window Slot Component -->
            <main class="flex-1 p-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <!-- Toast Component -->
    <div id="toast" x-data="{ openToast: false, message: '' }" @show-toast.window="
            message = $event.detail.value; 
            openToast = true; 
            setTimeout(() => openToast = false, 2500);
         " :class="openToast ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2 pointer-events-none'"
        class="fixed bottom-6 right-6 z-50 bg-gray-900 text-white text-sm font-medium px-5 py-3 rounded-xl shadow-xl transition-all duration-200">
        <span x-text="message"></span>
    </div>


    <!-- Placeholder if specific pages need script elements right before </body> closure -->
    {% block script %}{% endblock %}
</body>

</html>
