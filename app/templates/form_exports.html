<div x-show="activeTab === 'exports'" x-cloak class="space-y-4">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-50">
            <p class="text-sm font-semibold text-gray-900">Export Submissions</p>
            <p class="text-xs text-gray-400 mt-0.5">Download your collected form data records locally.</p>
        </div>

        <form action="" method="POST" class="p-5 space-y-4">
            <!-- Date Range Selector -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Date Range</label>
                <select name="date_range"
                    class="w-full max-w-xs bg-white px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand transition-colors">
                    <option value="all">All submissions ({{form.submissions}} total)</option>
                    <option value="30_days">Last 30 days</option>
                    <option value="7_days">Last 7 days</option>
                    <option value="custom">Custom range...</option>
                </select>
            </div>

            <!-- Export Formats Grid -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-2">File Format</label>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-xl">
                    <!-- CSV Option -->
                    <label
                        class="border border-gray-100 rounded-xl p-3.5 flex items-center gap-3 cursor-pointer hover:border-gray-200 transition-colors relative">
                        <input type="radio" name="format" value="csv" checked
                            class="rounded-full border-gray-300 text-brand focus:ring-brand w-4 h-4">
                        <div>
                            <p class="text-xs font-semibold text-gray-900">Comma Separated (CSV)</p>
                            <p class="text-[11px] text-gray-400 mt-0.5">Best for Excel or Sheets</p>
                        </div>
                    </label>

                    <!-- JSON Option -->
                    <label
                        class="border border-gray-100 rounded-xl p-3.5 flex items-center gap-3 cursor-pointer hover:border-gray-200 transition-colors relative">
                        <input type="radio" name="format" value="json"
                            class="rounded-full border-gray-300 text-brand focus:ring-brand w-4 h-4">
                        <div>
                            <p class="text-xs font-semibold text-gray-900">JSON Array</p>
                            <p class="text-[11px] text-gray-400 mt-0.5">Best for developers</p>
                        </div>
                    </label>

                    <!-- Excel Option -->
                    <label
                        class="border border-gray-100 rounded-xl p-3.5 flex items-center gap-3 cursor-pointer hover:border-gray-200 transition-colors relative">
                        <input type="radio" name="format" value="xlsx"
                            class="rounded-full border-gray-300 text-brand focus:ring-brand w-4 h-4">
                        <div>
                            <p class="text-xs font-semibold text-gray-900">Excel Worksheet</p>
                            <p class="text-[11px] text-gray-400 mt-0.5">Native spreadsheet file</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit"
                    class="bg-brand text-white text-xs font-semibold px-4 py-2.5 rounded-lg hover:opacity-90 transition-opacity flex items-center gap-2">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Generate Export File
                </button>
            </div>
        </form>
    </div>
</div>
