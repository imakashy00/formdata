<div id="{{id}}" x-data="formModal()" @open-modal.window="open()" @keydown.escape.window="close()" x-show="isOpen"
    x-cloak x-transition.opacity
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm"
    @click.self="close()" @htmx:after-request="handleSubmit($event)">

    <div class="bg-white rounded-2xl border border-gray-100 shadow-xl max-w-md w-full overflow-hidden">

        <!-- Modal Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-50">
            <h3 class="text-sm font-semibold text-gray-900">Create New {{for}}</h3>
            <button type="button" @click="isOpen = false"
                class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-lg hover:bg-gray-50">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Modal Form (Managed via HTMX) -->
        <form id="new-form" hx-post="{{url}}" hx-target="#{{target}}" hx-swap="afterend"
            hx-disabled-elt="find button[type=submit]" hx-swap="outerHTML" x-ref="formContainer" class="p-6">

            <div class="mb-5">
                <label for="form-name-input" class="block text-xs font-semibold text-gray-700 mb-2">{{for}}
                    Name</label>
                <input type="text" id="form-name-input" name="name" x-ref="formName" required
                    placeholder="e.g., Acme SaaS, Personal Blog"
                    class="w-full px-3.5 py-2 text-sm bg-white border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand-light transition-all placeholder:text-gray-400 text-gray-900" />

                {% if for == "Form" %}
                <input type="hidden" name="project_id" value="{{ project.id }}">
                {% endif %}

            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-between border-t border-gray-50 pt-4 mt-2">

                <div class="flex items-center gap-2.5 ml-auto">
                    <button type="button" @click="close()"
                        class="px-4 py-2 text-xs font-medium text-gray-600 hover:bg-gray-50 border border-gray-200 rounded-lg transition-colors">
                        Cancel
                    </button>
                    <button type="submit"
                        class="px-4 py-2 text-xs font-medium text-white bg-brand hover:bg-brand-dark rounded-lg shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        Create
                    </button>
                    {% with id="modal-loader", text=false, overlay=false %}
                    {% include 'partials/loading.html' %}
                    {% endwith %}

                </div>
            </div>
        </form>
    </div>
</div>

{% block script%}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('formModal', () => ({
            isOpen: false,

            open() {
                this.isOpen = true;
                setTimeout(() => {
                    this.$refs.formName.focus();
                }, 50);
            },

            close() {
                this.isOpen = false;
            },

            handleSubmit(event) {
                if (event.detail.successful) {
                    this.close();
                    this.$refs.formContainer.reset();
                }
            }
        }));
    });
</script>
{% endblock %}
