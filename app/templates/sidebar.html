{% set base = "nav-item flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium w-full text-left
transition-colors" %}
{% set inactive = "text-gray-500 hover:bg-gray-100 hover:text-gray-900" %}
<aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-56 bg-white border-r border-gray-100 flex flex-col
           -translate-x-full md:translate-x-0 transition-transform duration-200">

    <!-- Logo -->
    <div class="flex items-center gap-2.5 px-5 py-4 border-b border-gray-100">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" version="1.0" width="200.000000pt" height="200.000000pt"
                viewBox="0 0 200.000000 200.000000" preserveAspectRatio="xMidYMid meet"
                transform="matrix(1, 0, 0, 1, 0, 0)">

                <g transform="translate(0.000000,200.000000) scale(0.100000,-0.100000)" fill="#2563eb" stroke="none">
                    <path
                        d="M514 1616 c-94 -30 -177 -116 -203 -211 -7 -26 -11 -196 -11 -482 l0 -443 115 0 115 0 0 239 0 239 173 4 c224 4 229 7 288 165 16 43 29 79 29 81 0 1 -110 2 -245 2 l-245 0 0 66 c0 59 3 68 29 95 l29 29 220 0 219 0 10 33 c6 17 25 69 42 115 l30 82 -277 -1 c-196 0 -289 -4 -318 -13z"
                        fill="#2563eb" />
                    <path
                        d="M1124 1517 l-42 -112 127 -6 c144 -6 177 -17 244 -78 166 -154 129 -479 -67 -584 -39 -21 -57 -22 -336 -27 l-295 -5 -3 -112 -3 -113 300 0 c271 0 305 2 364 20 127 39 233 130 301 259 47 91 66 174 66 301 0 216 -82 389 -230 488 -87 59 -170 82 -289 82 l-96 0 -41 -113z"
                        fill="#2563eb" />
                </g>
            </svg>
        </div>
        <span class="font-bold text-gray-900 text-base">Formdata</span>
    </div>

    <!-- Nav links -->
    <nav class="flex-1 px-2.5 py-3 flex flex-col gap-0.5 overflow-y-auto">
        <!-- <p class="text-[10px] font-semibold uppercase tracking-widest text-gray-400 px-2 pt-1 pb-1">Main</p> -->

        <a href="/" class="{{ base }} {{ 'active' if page == 'dashboard' else inactive }}">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
            Dashboard
        </a>

        <a href="/projects" class="{{ base }} {{ 'active' if page == 'projects' else inactive }}">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
            </svg>
            Projects
        </a>
    </nav>
    <!-- User chip -->
    <a href="/account" class="flex items-center gap-2.5 px-4 py-3 border-b border-gray-100">
        <div id="sidebarAvatar"
            class="w-8 h-8 rounded-full bg-brand-mid flex items-center justify-center text-brand text-xs font-bold flex-shrink-0">
            AY
        </div>
        <div class="overflow-hidden">
            <p id="sidebarName" class="text-sm font-semibold text-gray-900 truncate">{{name}}</p>
            <p id="sidebarEmail" class="text-xs text-gray-400 truncate">{{email}}</p>
        </div>
    </a>
    <!-- Sign out -->
    <div class="px-2.5 py-3 border-t border-gray-100">
        <form action="/logout" method="POST" class="m-0">
            <button type="submit"
                class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-red-50 hover:text-brand transition-colors text-left bg-transparent border-0 cursor-pointer">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Sign out
            </button>
        </form>
    </div>

</aside>
