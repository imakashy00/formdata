<a id="form-container-{{form.id}}" href="/projects/{{project.id}}/forms/{{form.id}}/submissions"
    class="block bg-white rounded-xl border border-gray-100 shadow-sm p-5 cursor-pointer hover:shadow-md hover:border-brand-mid transition-all normal-case no-underline">

    <div class="flex justify-between">
        <div class="flex items-center gap-3 mb-4">
            <div class="w-9 h-9 rounded-lg bg-brand-light flex items-center justify-center shrink-0">
                <svg class="w-4 h-4 text-brand" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
                </svg>
            </div>

            <div class="flex items-center justify-between w-full">
                <div>
                    <p class="text-sm font-semibold text-gray-900 mb-0.5">{{form.name}}</p>
                </div>
            </div>
        </div>
        <div>
            {% if form.is_active %}
            <span class="text-xs font-semibold bg-emerald-50 text-emerald-600 px-2.5 py-0.5 rounded-full">Active</span>
            {% else %}
            <span class="text-xs font-semibold bg-red-50 text-red-600 px-2.5 py-0.5 rounded-full">Inactive</span>
            {% endif %}
        </div>
    </div>

    <div class="flex items-center justify-between">
        <span class="text-xs text-gray-400 gap-2 flex">
            <span>Created At:</span>
            <span>{{ form.created_at | strftime('%B %d, %Y') }}</span>
        </span>
        <span class="text-xs text-gray-400">{{ form.submissions_count }} submissions</span>
    </div>
</a>
