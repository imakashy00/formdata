[project]
name = "ytranscript"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "authlib>=1.6.5",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "paddle-python-sdk>=1.12.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.4",
    "pyjwt[crypto]>=2.10.1",
    "redis>=7.0.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.38.0",
    "asyncpg>=0.29.0",
    "slowapi>=0.1.9",
    "fastapi[standard]>=0.136.1",
    "greenlet>=3.2.4",
    "psycopg[binary]>=3.3.4",
    "pycountry>=26.2.16",
    "openpyxl>=3.1.5",
    "resend>=2.35.0",
    "markdown>=3.10.3",
    "aioboto3>=15.5.0",
    "gunicorn>=26.0.0",
    "setproctitle>=1.3.7",
    "httpx2>=2.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "aiosqlite>=0.20.0",
    "fakeredis>=2.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

